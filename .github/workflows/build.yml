name: Build and Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # Allows manual trigger from UI

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install
        working-directory: ./server

      - name: Build project
        run: pnpm run build
        working-directory: ./server

      - name: Create Zip Archive
        # Use -j for resource.toml so it sits at the root of the zip alongside the dist folder
        run: |
          zip -r resource.zip server/dist resource.toml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Uses the actual tag name (e.g., v1.0.2) for the release
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          files: resource.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
